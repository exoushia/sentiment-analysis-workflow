run_mode: baseline  # Options: baseline only

baseline:
  tfidf_max_features: 5000
  model: logisticregression  # or bernoulinaivebayes
  grid_search: true
  logisticregression:
    max_iter: 200
    param_grid:
      estimator__C: [0.1, 1.0, 10.0]
      estimator__penalty: ['l1', 'l2']
      estimator__solver: ['liblinear']
  bernoulinaivebayes:
    param_grid:
      alpha: [0.1, 1.0, 10.0]
  randomforest:
    param_grid:
      n_estimators: [100, 200, 300]
      max_depth: [10, 20, null]
      min_samples_split: [2, 5]
      min_samples_leaf: [1, 2]
  tags:
    model_type: baseline
    data_version: v1

test_size: 0.2

# Sentiment label mapping
sentiment_labels:
  0: "Negative"
  1: "Neutral"
  2: "Positive"
